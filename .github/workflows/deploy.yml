name: Test, build WASM, deploy playground

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed for peaceiris/actions-gh-pages

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and SPIRV-Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build spirv-tools

      - name: Build compiler and tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFLUX_BUILD_TESTS=ON
          cmake --build build --parallel

      # Catch2 unit tests + spirv-val on every example at -O0 and -O2.
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Build WASM ──────────────────────────────────────────────────────────
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Build flux_wasm.js + flux_wasm.wasm
        run: |
          emcmake cmake -S wasm/ -B build_wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build_wasm --parallel
          mkdir -p frontend/public
          cp build_wasm/flux_wasm.js   frontend/public/
          cp build_wasm/flux_wasm.wasm frontend/public/

      # ── Build React app ─────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # ── Deploy to GitHub Pages ──────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
